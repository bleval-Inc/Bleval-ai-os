# Trend Analysis Workflow
# Version: 3.0.0

name: Trend Analysis
org: bleval
department: marketing
coordinator: jenson

agents:
  - nova

steps:
  - id: 1
    name: "Monitor Trends"
    agent: nova
    description: "Continuously monitor industry trends, competitor moves, and technology shifts"
    outputs:
      - raw-trend-data
    events_emitted: []

  - id: 2
    name: "Analyze Impact"
    agent: nova
    description: "Analyze trend significance, potential impact, and relevance to Bleval"
    inputs:
      - raw-trend-data
    outputs:
      - impact-analysis
    events_emitted: []

  - id: 3
    name: "Produce Trend Brief"
    agent: nova
    description: "Compile trend brief with actionable insights and recommended responses"
    inputs:
      - impact-analysis
    outputs:
      - trend-brief
    events_emitted:
      - trend-detected
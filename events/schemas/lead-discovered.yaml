# Schema: Lead Discovered Event

name: lead-discovered
version: "1.0"

payload:
  lead_id:
    type: string
    required: true
    description: "Unique identifier for the lead"
  company:
    type: string
    required: true
    description: "Company name"
  industry:
    type: string
    required: true
    description: "Industry vertical"
  website:
    type: string
    required: false
    description: "Company website URL"
  contact:
    type: object
    required: false
    description: "Contact information if available"
  opportunity_score:
    type: integer
    required: true
    min: 0
    max: 100
    description: "Opportunity score (0-100)"
  problems_found:
    type: array
    required: false
    items: string
    description: "Digital problems identified"
  recommended_solution:
    type: string
    required: false
    description: "Recommended Bleval solution"
  report_path:
    type: string
    required: true
    description: "Path to the full research report in memory"
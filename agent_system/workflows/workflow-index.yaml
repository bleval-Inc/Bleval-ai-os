# Bleval AI OS — Workflow Registry
# Version: 3.0.0
# Jenson launches workflows. Workflows coordinate participating agents.

version: "3.0"

workflows:
  # ── Sales Workflows ─────────────────────────────────────
  sales/prospect-research:
    description: "Research and qualify new prospects"
    org: bleval
    department: sales
    coordinator: jenson
    agents: [atlas]
    events: [lead-discovered]
    steps:
      - name: research
        agent: atlas
        action: "Research target market segment and identify ICP-matching businesses"
        output: lead-discovered event
      - name: qualify
        agent: jenson
        action: "Review research and qualify leads for outreach"
        output: lead-qualified event

  sales/outreach-campaign:
    description: "Design and execute outbound outreach campaign"
    org: bleval
    department: sales
    coordinator: jenson
    agents: [apollo]
    events: [lead-qualified]
    trigger_event: lead-qualified
    steps:
      - name: design
        agent: apollo
        action: "Design outreach sequence (channel, messaging, cadence)"
      - name: execute
        agent: apollo
        action: "Execute outreach sequence and track responses"
      - name: report
        agent: apollo
        action: "Report campaign performance metrics"

  sales/deal-closing:
    description: "Prepare proposals and close deals"
    org: bleval
    department: sales
    coordinator: jenson
    agents: [closer]
    events: [response-received]
    trigger_event: response-received
    steps:
      - name: prepare
        agent: closer
        action: "Prepare prospect profile, objection handling, and strategy"
      - name: propose
        agent: closer
        action: "Create tailored proposal"
      - name: close
        agent: closer
        action: "Execute closing strategy"
      - name: analyze
        agent: closer
        action: "Post-deal analysis"

  # ── Marketing Workflows ─────────────────────────────────
  marketing/content-production:
    description: "Research, create, and publish content"
    org: bleval
    department: marketing
    coordinator: jenson
    agents: [nova, creator, analyst]
    events: [content-researched, content-created, content-published]
    steps:
      - name: research
        agent: nova
        action: "Research market trends and content opportunities"
        output: content-researched event
      - name: create
        agent: creator
        action: "Produce content based on research direction"
        output: content-created event
      - name: publish
        agent: creator
        action: "Publish content to distribution channels"
        output: content-published event
      - name: measure
        agent: analyst
        action: "Track performance and extract learnings"

  marketing/campaign-launch:
    description: "Plan and launch marketing campaigns"
    org: bleval
    department: marketing
    coordinator: jenson
    agents: [nova, creator, analyst]
    events: []
    steps:
      - name: plan
        agent: nova
        action: "Develop campaign strategy and direction"
      - name: produce
        agent: creator
        action: "Create campaign assets"
      - name: launch
        agent: jenson
        action: "Approve and launch campaign"
      - name: monitor
        agent: analyst
        action: "Track campaign performance and ROI"

  marketing/market-research:
    description: "Research market trends and competitive landscape"
    org: bleval
    department: marketing
    coordinator: jenson
    agents: [nova]
    events: [content-researched]
    steps:
      - name: research
        agent: nova
        action: "Research target markets, competitors, and trends"
        output: content-researched event

  # ── Development Workflows ───────────────────────────────
  development/feature-development:
    description: "Design, build, and deliver a feature or fix"
    org: bleval
    department: development
    coordinator: jenson
    agents: [forge, tester]
    events: [feature-requested, development-completed, test-completed]
    trigger_event: feature-requested
    steps:
      - name: design
        agent: forge
        action: "Design architecture and implementation plan"
      - name: implement
        agent: forge
        action: "Build the feature or fix"
        output: development-completed event
      - name: test
        agent: tester
        action: "Test and validate the implementation"
        output: test-completed event
      - name: review
        agent: jenson
        action: "Review and approve deliverable"

  development/code-review:
    description: "Review code for quality and correctness"
    org: bleval
    department: development
    coordinator: jenson
    agents: [tester]
    events: []
    steps:
      - name: review
        agent: tester
        action: "Review code against quality standards"
      - name: report
        agent: tester
        action: "Report findings and recommendations"

  development/autonomous-cycle-trigger:
    description: "Scheduled trigger for autonomous development cycle"
    org: bleval
    department: development
    coordinator: jenson
    agents: [jenson]
    events: [development-autonomous-cycle]
    trigger_event: system-scheduled
    cron: "0 */6 * * *"
    steps:
      - name: trigger.cycle
        agent: jenson
        action: "Check for autonomous-ready issues and trigger development lifecycle"
        output: development-autonomous-cycle event
      - name: trigger.no_work
        agent: jenson
        action: "Log no work available"

  development/autonomous-lifecycle:
    description: "Full autonomous development lifecycle by Jenson using Phase H integrations"
    org: bleval
    department: development
    coordinator: jenson
    agents: [jenson, forge, tester, reviewer, qa]
    events: [development-autonomous-cycle, work-discovered, backlog-prioritized, issue-analyzed, design-completed, branch-created, environment-ready, implementation-completed, changes-pushed, unit-tests-completed, integration-tests-completed, static-analysis-completed, qc-completed, pr-created, team-notified, reviews-received, founder-approval-received, pr-merged, issue-closed, delivery-complete, learning-recorded, patterns-updated]
    trigger_event: development-autonomous-cycle
    approval_policy:
      authority: executive_approval
      requires_qc: true
      requires_review: true
      founder_approval_for:
        - merge_to_main
        - production_deploy
        - schema_changes
    tools:
      - github
      - slack
    steps:
      - name: plan.discover_work
        agent: jenson
        action: "Scan GitHub for autonomous-ready issues and prioritize"
        output: work-discovered event
      - name: plan.prioritize
        agent: jenson
        action: "Analyze and prioritize work items by impact and dependencies"
        output: backlog-prioritized event
      - name: research.analyze_issue
        agent: jenson
        action: "Deep analyze highest priority issue and affected code"
        output: issue-analyzed event
      - name: research.design_solution
        agent: forge
        action: "Create technical design and implementation plan"
        output: design-completed event
      - name: prepare.create_branch
        agent: jenson
        action: "Create autonomous feature branch on GitHub"
        output: branch-created event
      - name: prepare.setup_environment
        agent: forge
        action: "Set up dev environment and run baseline tests"
        output: environment-ready event
      - name: execute.implement
        agent: forge
        action: "Implement solution per design with incremental commits"
        output: implementation-completed event
      - name: execute.push_changes
        agent: forge
        action: "Push changes to GitHub remote"
        output: changes-pushed event
      - name: test.run_unit_tests
        agent: tester
        action: "Run unit test suite and check coverage"
        output: unit-tests-completed event
      - name: test.run_integration_tests
        agent: tester
        action: "Run integration tests for Phase H providers"
        output: integration-tests-completed event
      - name: test.static_analysis
        agent: reviewer
        action: "Run static analysis (type check, lint, security)"
        output: static-analysis-completed event
      - name: qc.quality_gate
        agent: qa
        action: "Evaluate quality gate - all tests, coverage, analysis"
        output: qc-completed event
      - name: review.create_pr
        agent: jenson
        action: "Create detailed PR with test results and QC report"
        output: pr-created event
      - name: review.notify_team
        agent: jenson
        action: "Notify development team via Slack for review"
        output: team-notified event
      - name: approval.wait_reviews
        agent: jenson
        action: "Monitor PR for required approvals"
        output: reviews-received event
      - name: approval.founder_approval
        agent: jenson
        action: "Request Founder approval if required for merge/deploy"
        output: founder-approval-received event
      - name: delivery.merge_pr
        agent: jenson
        action: "Squash merge PR and delete branch"
        output: pr-merged event
      - name: delivery.update_issue
        agent: jenson
        action: "Close related issue with completion details"
        output: issue-closed event
      - name: delivery.notify_complete
        agent: jenson
        action: "Send completion notification via Slack"
        output: delivery-complete event
      - name: learn.record_outcome
        agent: jenson
        action: "Record comprehensive learning data for future improvements"
        output: learning-recorded event
      - name: learn.update_patterns
        agent: jenson
        action: "Update autonomous development patterns based on outcome"
        output: patterns-updated event

  # ── Operations Workflows ────────────────────────────────
  operations/daily-report:
    description: "Generate daily operational status report"
    org: bleval
    department: operations
    coordinator: jenson
    agents: [ledger, pulse]
    events: [report-ready]
    steps:
      - name: collect-financials
        agent: ledger
        action: "Gather financial metrics and updates"
      - name: check-health
        agent: pulse
        action: "Check client health and operational status"
      - name: compile
        agent: jenson
        action: "Compile daily report"

  operations/weekly-review:
    description: "Generate weekly review with insights and recommendations"
    org: bleval
    department: operations
    coordinator: jenson
    agents: [ledger, pulse]
    events: [report-ready]
    steps:
      - name: financial-summary
        agent: ledger
        action: "Prepare weekly financial summary"
      - name: client-summary
        agent: pulse
        action: "Prepare weekly client status summary"
      - name: review
        agent: jenson
        action: "Review and generate recommendations"

  # ── Cross-org Workflows ─────────────────────────────────
  cross-org/executive-sync:
    description: "Synchronize across all executives"
    org: all
    department: executive
    coordinator: jenson
    agents: [jenson, valta_prime, yamako]
    events: [executive-message]
    steps:
      - name: collect
        agent: jenson
        action: "Gather updates from all organizations"
      - name: sync
        agent: jenson, valta_prime, yamako
        action: "Synchronize priorities and cross-org dependencies"
      - name: report
        agent: jenson
        action: "Report to founder"

  cross-org/escalation:
    description: "Handle cross-org escalations"
    org: all
    department: executive
    coordinator: jenson
    agents: [jenson, valta_prime, yamako]
    events: [escalation]
    steps:
      - name: assess
        agent: jenson
        action: "Assess escalation severity and impact"
      - name: resolve
        agent: jenson, valta_prime, yamako
        action: "Coordinate resolution across organizations"
      - name: document
        agent: jenson
        action: "Document escalation and resolution"
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-os"
version = "3.0.0"
description = "AI Operating System — coordinate executives, departments, workflows, and agents"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "aiohttp>=3.9.0",
    "anthropic>=0.117.0",
    "fastapi>=0.115.0",
    "openai>=1.55.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.10",
    "PyYAML>=6.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
include = ["axiom", "axiom.*"]

[project.urls]
homepage = "https://github.com/bleval/axiom-os"
repository = "https://github.com/bleval/axiom-os"

[project.scripts]
axiom = "axiom.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["backend"]
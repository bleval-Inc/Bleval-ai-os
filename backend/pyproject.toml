[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-os"
version = "3.0.0"
description = "AI Operating System — coordinate executives, departments, workflows, and agents"
license = {text = "MIT"}
requires-python = ">=3.11"

dependencies = [
    "aiohttp>=3.9.0",
    "anthropic>=0.117.0",
    "beautifulsoup4>=4.12.0",
    "caldav>=1.4.0",
    "croniter>=3.0.0",
    "email-normalize>=1.0.0",
    "fastapi>=0.115.0",
    "feedparser>=6.0.0",
    "GPUtil>=1.4.0",
    "google-api-python-client>=2.150.0",
    "icalendar>=6.0.0",
    "jsonschema>=4.0.0",
    "MetaTrader5>=5.0.0",
    "numpy>=2.0.0",
    "openai>=1.55.0",
    "phonenumbers>=8.13.0",
    "psutil>=7.0.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.10",
    "PyYAML>=6.0",
    "readability-lxml>=0.8.0",
    "slack_sdk>=3.30.0",
    "spacy>=3.7.0",
    "SQLAlchemy>=2.0.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.32.0",
    "vaderSentiment>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
include = ["axiom", "axiom.*"]

[project.urls]
homepage = "https://github.com/bleval/axiom-os"
repository = "https://github.com/bleval/axiom-os"

[project.scripts]
axiom = "axiom.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["backend"]
asyncio_mode = "auto"